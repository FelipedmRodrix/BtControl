version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: arenabt-postgres-dev
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: arenabt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./lib/db/db.json:/app/lib/db/db.json
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
